name = "adigunbible"
main = "worker/index.mjs"
compatibility_date = "2026-11-22"
workers_dev = false
preview_urls = false

[vars]
PRODUCT_ACCOUNT_PREFIX = "adigunbible"

[assets]
directory = "./dist-worker"
binding = "ASSETS"
run_worker_first = true


[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "48"
simple = { limit = 10, period = 60 }

[env.preview]
name = "adigunbible-preview"
workers_dev = true
preview_urls = false

[env.preview.vars]
PRODUCT_ACCOUNT_PREFIX = "adigunbible_preview"

[env.preview.assets]
directory = "./dist-worker"
binding = "ASSETS"
run_worker_first = true

[[env.preview.ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "49"
simple = { limit = 10, period = 60 }
