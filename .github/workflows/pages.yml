name: Deploy AdigunBible to GitHub Pages

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-status:
    name: Validate chapter release evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate editorial evidence
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          IS_CHAPTER_DRAFT: ${{ github.event.pull_request.draft }}
        shell: bash
        run: |
          mode=--main
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git diff --no-ext-diff --no-renames --name-only -z "origin/$GITHUB_BASE_REF...HEAD" > "$RUNNER_TEMP/adigunbible-pr-files"
            while IFS= read -r -d '' changed; do
              case "$changed" in
                .github/workflows/pages.yml|.gitignore|scripts/build-legacy-redirect.mjs|scripts/build-product.mjs|scripts/product-access.test.mjs|worker/index.mjs|wrangler.toml|supabase/migrations/??????????????_adigunbible*.sql)
                  ;;
                *)
                  mode=--pr
                  if [[ "$IS_CHAPTER_DRAFT" == true ]]; then mode=--pr-draft; fi
                  break
                  ;;
              esac
            done < "$RUNNER_TEMP/adigunbible-pr-files"
          fi
          node scripts/release-gate.mjs "$mode"
  product-access:
    name: Validate AdigunBible product access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build-product.mjs
      - run: node --test scripts/product-access.test.mjs
      - run: node scripts/build-legacy-redirect.mjs

  package-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [editorial-status, product-access]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build legacy redirect after the Worker cutover
        if: vars.ADIGUNBIBLE_WORKER_CUTOVER == 'true'
        run: node scripts/build-legacy-redirect.mjs
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ vars.ADIGUNBIBLE_WORKER_CUTOVER == 'true' && 'dist-legacy' || '.' }}
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
