name: Deploy AdigunBible to GitHub Pages

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-status:
    name: Check chapter editorial status
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Check for chapters in editorial review
        if: github.event_name != 'pull_request' || !github.event.pull_request.draft
        shell: node {0}
        run: |
          const reader = require('node:fs').readFileSync('index.html', 'utf8');
          if (/\binReview\s*:\s*true\b/.test(reader)) {
            throw new Error('Resolve all chapter editorial reviews before releasing the reader.');
          }
  package-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: editorial-status
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
