name: Deploy AdigunBible to GitHub Pages

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-status:
    name: Validate chapter release evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit draft chapter pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/release-gate.mjs --pr-draft
      - name: Validate chapter pull request for release
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/release-gate.mjs --pr
      - name: Validate published chapter evidence
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: node scripts/release-gate.mjs --main
  product-access:
    name: Validate AdigunBible product access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build-product.mjs
      - run: node --test scripts/product-access.test.mjs

  package-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [editorial-status, product-access]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
