name: Deploy AdigunBible to GitHub Pages

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-status:
    name: Validate chapter release evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate editorial evidence
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          IS_CHAPTER_DRAFT: ${{ github.event.pull_request.draft }}
        shell: bash
        run: |
          mode=--main
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git diff --no-ext-diff --no-renames --name-only -z "origin/$GITHUB_BASE_REF...HEAD" > "$RUNNER_TEMP/adigunbible-pr-files"
            while IFS= read -r -d '' changed; do
              case "$changed" in
                .github/workflows/pages.yml|.gitignore|scripts/build-legacy-redirect.mjs|scripts/build-product.mjs|scripts/product-access.test.mjs|worker/index.mjs|wrangler.toml|supabase/migrations/??????????????_adigunbible*.sql)
                  ;;
                *)
                  mode=--pr
                  if [[ "$IS_CHAPTER_DRAFT" == true ]]; then mode=--pr-draft; fi
                  break
                  ;;
              esac
            done < "$RUNNER_TEMP/adigunbible-pr-files"
          fi
          node scripts/release-gate.mjs "$mode"
  product-access:
    name: Validate AdigunBible product access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build-product.mjs
      - run: node --test scripts/product-access.test.mjs
      - run: node scripts/build-legacy-redirect.mjs

      - name: Verify the Leviticus 4 reader in Chrome
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/leviticus-4-release'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          chromedriver --port=9515 &
          trap 'jobs -p | xargs -r kill' EXIT
          curl --retry 8 --retry-connrefused --fail --silent http://127.0.0.1:9515/status >/dev/null
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          async function request(path, data, method = data === undefined ? 'GET' : 'POST') {
            const response = await fetch('http://127.0.0.1:9515' + path, {
              method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data),
            });
            const result = await response.json();
            assert(response.ok, JSON.stringify(result));
            return result.value;
          }
          const {sessionId} = await request('/session', {
            capabilities: {alwaysMatch: {browserName: 'chrome', 'goog:chromeOptions': {
              args: ['--headless', '--window-size=1280,900'],
            }}},
          });
          const session = '/session/' + sessionId;
          const evaluate = (script, args = []) => request(session + '/execute/sync', {script, args});
          try {
            await request(session + '/url', {url: 'http://127.0.0.1:8765/index.html'});
            const rendered = await evaluate(`
              const book = document.querySelector('#book-select');
              book.value = 'LEV';
              book.dispatchEvent(new Event('change'));
              document.querySelectorAll('#chapter-grid .chbtn')[3].click();
              const rows = [...document.querySelectorAll('.vtext')];
              const glosses = [...document.querySelectorAll('.verse-gloss')];
              const sample = document.querySelector('#v1 .verse-gloss');
              sample.scrollIntoView({block: 'center', behavior: 'instant'});
              const rect = sample.getClientRects()[0];
              return {title: document.querySelector('#chapter-heading').textContent,
                verses: rows.map(row => [Number(row.previousElementSibling.textContent), row.getBoundingClientRect().height]),
                glosses: glosses.length, missing: glosses.filter(gloss => !gloss.title.trim()).length,
                point: [Math.floor(rect.left + rect.width / 2), Math.floor(rect.top + rect.height / 2)]};
            `);
            assert.equal(rendered.title, 'Leviticus 4');
            assert.deepEqual(rendered.verses.map(([number]) => number), Array.from({length: 35}, (_, i) => i + 1));
            assert(rendered.verses.every(([, height]) => height > 0));
            assert.equal(rendered.glosses, 158);
            assert.equal(rendered.missing, 0);
            const [x, y] = rendered.point;
            await request(session + '/actions', {actions: [{
              type: 'pointer', id: 'mouse', parameters: {pointerType: 'mouse'},
              actions: [{type: 'pointerMove', duration: 0, x, y, origin: 'viewport'}],
            }]});
            assert.equal(await evaluate("return document.querySelector('.verse-gloss:hover')?.title"),
              'the LORD spoke to Moses');
            console.log('Chrome rendered all 35 Leviticus verses and 158 tooltip titles; the hover sample matched.');
          } finally {
            await request(session, undefined, 'DELETE');
          }
          NODE

  package-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [editorial-status, product-access]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build legacy redirect after the Worker cutover
        if: vars.ADIGUNBIBLE_WORKER_CUTOVER == 'true'
        run: node scripts/build-legacy-redirect.mjs
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ vars.ADIGUNBIBLE_WORKER_CUTOVER == 'true' && 'dist-legacy' || '.' }}
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
